services:
  mysql:
    image: mysql:8
    container_name: retail-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: online_retail_ii
    ports:
    - "3307:3306"
    command: ["--local-infile=1"]
    volumes:
      - mysql_data:/var/lib/mysql

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/New_York
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - mysql

volumes:
  mysql_data:
  n8n_data:
